[metadata]
name = transcriptor
version = 0.1.0
author = Jonnieey
author_email = johnjahi55@gmail.com

[options]
packages = find:
package_dir = = src
include_package_data = True
python_requires = >= 3.6.2
install_requires =
    audioread~=2.1
    python-magic~=0.4
    appdirs~=1.4
    click~=8.0
    docxtpl~=0.15
    pdfkit~=1.0
    rich>=11.1.0

[options.extras_require]
dev = 
    black~=21.12b0
    pytest~=6.2
    mypy~=0.931
    isort~=5.10
    autoflake~=1.4

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
filterwarnings =
    error
#filter unraisableexception
addopts = -p no:unraisableexception

[mypy]
files = transcriptor
warn_unused_configs = True
ignore_missing_imports = True
python_version = 3.10

[black]
line-length = 88

[isort]
line_length = 88
multi_line_output = 3
force_single_line = False
balanced_wrapping = True
include_trailing_comma = True

[mypy-importlib_metadata.*]
ignore_missing_imports = True

[options.entry_points]
console_scripts =
    transcriptor = transcriptor.main:main
