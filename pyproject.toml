[project]
name = "transcriptor"
version = "0.1.0"
description = ""
authors = [
    {name = "Jonnieey", email = "johnjahi55@gmail.com"},
]
dependencies = [
    "audioread~=2.1",
    "python-magic~=0.4",
    "appdirs~=1.4",
    "click~=8.0",
    "beautifultable~=1.0",
    "docxtpl~=0.15",
    "pdfkit~=1.0",
    "mypy~=0.931",
]
requires-python = ">=3.9"
license = {text = "MIT"}

[project.urls]
homepage = ""

[build-system]
requires = ["pdm-pep517"]
build-backend = "pdm.pep517.api"

[tool]
[tool.pdm.scripts]
transcriptor = {call = "transcriptor.main:main"}

[tool.pdm.dev-dependencies]
tests = [
    "pytest~=6.2",
    "black~=21.12b0",
    "isort~=5.10",
    "autoflake~=1.4",
]

[tool.black]
line-length = 88 

[tool.isort]
line_length = 88
multi_line_output = 3
force_single_line = false
balanced_wrapping = true
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
